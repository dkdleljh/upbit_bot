base_ccy: KRW
mode: paper
timezone: Asia/Seoul

env:
  upbit_access_key: UPBIT_ACCESS_KEY
  upbit_secret_key: UPBIT_SECRET_KEY

universe:
  top30: 30  # KRW/BTC/USDT 마켓까지 포함되도록 후보를 넓힘
  tradable_top10: 10
  refresh_seconds: 600  # 5분 -> 10분으로 늦춤 (API 레이트 관리)

gates:
  # (승률형) 스프레드 엄격화: 체결/리버설 비용을 줄여 '비싸게 사고 싸게 파는' 체감을 완화
  spread_max: 0.0020
  # BTC/USDT 마켓은 스프레드가 구조적으로 넓어(유동성 낮음) 별도 컷을 둡니다.
  spread_max_btc: 0.02
  spread_max_usdt: 0.02
  depth_ratio_min: 5.0
  entry_slippage_cap: 0.0025
  exit_slippage_cap: 0.0030
  cooldown_minutes: 30

signal:
  timeframe_main: 1m
  timeframe_filter: 5m
  breakout_lookback_minutes: 20
  # signal model profile: full(default) | simple(lite)
  profile: simple
  # (승률형) 거래대금 비율 컷을 높여 잡음 진입을 줄입니다.
  notional_ratio_min: 0.9

risk:
  max_positions: 10
  total_exposure_cap: 0.70
  per_coin_exposure_cap: 0.12
  risk_per_trade_start: 0.001
  risk_per_trade_target: 0.002
  promote_requirements:
    min_trades: 200
    max_order_error_rate: 0.005
    max_avg_entry_slippage: 0.0025
  daily_stop_loss_pct: -0.02

stops:
  atr_period: 14
  atr_timeframe: 1m
  atr_multiplier: 1.5
  stop_pct_min: 0.008
  stop_pct_max: 0.020
  tp_net_pnl_pct: 0.015 
  tp1_ratio: 0.5
  tp2_ratio: 0.3
  trailing_stop_pct: 0.010 

regime:
  volatility_high_threshold: 1.5
  volatility_low_threshold: 0.6
  regime_lookback_period: 50
  regime_adaptive_tp_high: 1.3
  regime_adaptive_tp_low: 0.8
  regime_adaptive_trailing_high: 1.2
  regime_adaptive_trailing_low: 0.9
  position_size_high_vol: 0.6
  position_size_low_vol: 1.2

  # Regime-aware signal routing (Pro Trader Enhancement)
  # Different market regimes require different trading strategies
  regime_configs:
    strong_trend:
      # Trend-following mode: requires strong EMA alignment + high ADX
      min_adx: 25
      ema_weight: 40          # Higher weight for EMA in strong trend
      volume_weight: 20
      momentum_weight: 15
      breakout_weight: 15
      cutoff_bonus: 5          # More lenient cutoff in strong trend
    weak_trend:
      # Range/sideways mode: require tighter stops, focus on mean reversion
      min_adx: 15
      ema_weight: 20
      volume_weight: 25
      momentum_weight: 20
      breakout_weight: 25
      cutoff_bonus: -5         # Stricter cutoff in weak trend
    high_volatility:
      # High volatility mode: reduce position size, wider stops
      min_adx: 20
      ema_weight: 25
      volume_weight: 30       # Higher volume confirmation needed
      momentum_weight: 15
      breakout_weight: 20
      cutoff_bonus: 0
    low_volatility:
      # Low volatility mode: can be more aggressive
      min_adx: 15
      ema_weight: 30
      volume_weight: 15
      momentum_weight: 20
      breakout_weight: 25
      cutoff_bonus: 10

# Position sizing improvements (Pro Trader Enhancement)
position_sizing:
  # Fractional Kelly: reduces overbetting while maintaining edge
  kelly_fraction: 0.25         # 0.25x Kelly = quarter Kelly (conservative)
  # Loss streak throttle: reduce size after consecutive losses
  loss_streak_threshold: 3    # After 3 consecutive losses
  loss_streak_reduction: 0.5  # Reduce position by 50% during streak
  # Minimum trades before full Kelly applies
  min_trades_for_full_kelly: 50

# Execution improvements (Pro Trader Enhancement)
execution:
  # Maker-first execution: try limit orders before market orders
  use_maker_first: true
  limit_order_timeout_seconds: 3.0
  # Only use limit orders when spread is tight enough
  max_spread_for_limit: 0.0015
  # Adjust timeout based on volatility
  volatility_adaptive_timeout: true

# MTM (Mark-to-Market) risk control (Pro Trader Enhancement)
mtm_risk:
  # Track unrealized PnL in drawdown calculation
  use_mtm_drawdown: true
  # MTM drawdown threshold to pause entries
  mtm_drawdown_pause_pct: -0.08  # 8% unrealized loss
  # MTM drawdown threshold for full stop
  mtm_drawdown_stop_pct: -0.12   # 12% unrealized loss

time_rules:
  min_hold_seconds: 60
  soft_cut_minutes: 20
  soft_cut_progress: 0.02
  hard_exit_minutes: 60

replace:
  score_gap_min: 12
  coin_cooldown_minutes: 5
  rate_limit_per_minute: 1
  exceptions:
    trend_ok_drawdown_from_peak: 0.008
    replace_if_pnl_below: -0.008

min_notional_krw: 5000

dust:
  # 평상시에는 더스트가 생기지 않게(진입 금액 상향, 매도 수량 동기화, 최소금액 미만은 무시)
  # 자동 top-up 매수는 끕니다. (원하실 때 scripts/cleanup_dust.py로 일괄 정리)
  topup_before_sell: true
  # 매도 주문금액이 5,000원 미만일 때, 부족분을 소액 추가매수해서(시장가) 5,000원 이상 만든 뒤 매도
  topup_buffer_krw: 2000
  topup_max_krw: 20000
  # 더스트 처리 중 동일 코인 반복 매수/매도 루프 방지
  topup_cooldown_seconds: 1800
  # 손절 매도 금액이 최소 주문금액 미만일 때 동일 이벤트 반복 루프 방지
  stoploss_under_min_notional_cooldown_seconds: 600

daily_report:
  hour: 0
  minute: 5

fees:
  KRW: 0.0005
  BTC: 0.0010
  USDT: 0.0010

runtime:
  loop_interval_seconds: 10
  paper_initial_equity_krw: 10000000
  backtest_days: 3
  backtest_default_slippage: 0.002
  # 손절 최악 구간에서도(min_entry * (1 - stop_pct_max)) 최소 주문금액을 유지하도록 진입 최소값 설정
  min_entry_krw: 5500
  safe_mode_error_threshold: 5
  # 실계좌 기반 평가금액(미실현손익 포함) 스냅샷 저장 주기
  equity_snapshot_seconds: 300

live:
  # 재시작 시 '기존 보유(수동매매 포함)'를 포트폴리오로 자동 복원해서 손절/익절까지 관리할지 여부
  # - false 권장(안전): 봇이 산 것만 관리
  # - true: 계좌 보유분도 봇이 관리(WS 손절이 바로 터질 수 있으니 주의)
  manage_existing_positions: false
  # 기존보유 복원 포지션은 즉시 WS 손절을 걸면 과매도/휩쏘 위험이 있어 유예시간을 둡니다(초)
  restored_stoploss_grace_seconds: 300

  # (추천값) WS 손절 발생 코인은 신규진입을 일정 시간 차단(시장 급변/루프 방지)
  # - 손절이 반복되면(윈도우 내) 30m → 60m → 120m … 단계적으로 증가
  market_quarantine_on_stoploss_minutes: 30
  market_quarantine_max_minutes: 360
  market_quarantine_stoploss_window_seconds: 3600

  # Circuit Breaker: 손절이 연속으로 터질 때 자동으로 신규 진입을 잠시 중단
  circuit_breaker:
    window_seconds: 300          # 최근 N초
    max_stoploss_events: 2       # 손절 이벤트가 이 횟수 이상이면
    pause_minutes: 30            # 신규 진입을 M분 중단

  # Circuit Breaker (Order Errors): 주문 실패/레이트리밋/잔고부족 등이 연속으로 발생하면 신규 진입 중단
  circuit_breaker_order_errors:
    window_seconds: 180
    max_error_events: 3
    pause_minutes: 20

  # 주문 오류가 연속으로 터질 때 '진입만 중단'이 아니라 safe_mode로 승격(보수 운용)
  safe_mode_on_order_errors: true
  # safe_mode 자동 복구(오류가 사라졌고 일정 시간 안정화되면 자동 해제)
  safe_mode_auto_recover: true
  safe_mode_recover_seconds: 900

  # 주문 멱등성(중복 제출 방지) 버킷(초)
  order_dedup_entry_seconds: 10
  order_dedup_exit_seconds: 5
  order_dedup_stop_seconds: 2
  # 일반 SELL(익절/시간청산) 지정가 대기 시간(초). 초과 시 시장가 fallback
  sell_limit_wait_seconds: 2.0

walk_forward:
  # In-sample period for parameter optimization (days)
  in_sample_days: 30
  # Out-of-sample period for validation (days)
  out_of_sample_days: 7
  # Step size to move forward each iteration (days)
  step_days: 7
  # Minimum trades required in OOS to consider valid
  min_oos_trades: 5
  # Maximum iterations for random search optimization
  max_iterations: 50
  # Number of parallel jobs (for future use)
  n_jobs: 4

notifications:
  # Enable/disable all notifications
  enabled: true
  # Minimum priority level to notify (debug, info, warning, error, critical)
  min_priority: warning
  # Notify on trade execution
  notify_on_trade: true
  # Notify on stop loss
  notify_on_stoploss: true
  # Notify on errors
  notify_on_error: true
  # Notify on safe mode activation
  notify_on_safe_mode: true
  # Notify on circuit breaker activation
  notify_on_circuit_breaker: true
  # Notify daily summary
  notify_on_daily_summary: true
